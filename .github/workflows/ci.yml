name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run assert:no-bun-sqlite-leak
      - run: bun run assert:storage-entry-isolation
      - run: bun run assert:react-graph-browser-entry
      - run: bun run typecheck
      - run: bun test
